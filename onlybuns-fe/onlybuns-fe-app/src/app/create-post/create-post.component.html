<form class="post-form" [formGroup]="postForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
  <h2>Nova objava</h2>

  <div class="form-group">
    <label for="description">Opis</label>
    <input id="description" type="text" formControlName="description" required placeholder="Unesite opis..." />
  </div>

  <div class="form-group">
    <label for="image">Izaberi sliku</label>
    <input id="image" type="file" (change)="onFileSelected($event)" accept="image/*" />
  </div>

  <div class="form-group">
    <label for="map">Izaberi lokaciju na mapi</label>
    <div id="map"></div>
  </div>

  <button type="submit" [disabled]="postForm.invalid">📤 Postavi objavu</button>
  <div *ngIf="successMessage" class="success-message">
  ✅ {{ successMessage }}
</div>
</form>
